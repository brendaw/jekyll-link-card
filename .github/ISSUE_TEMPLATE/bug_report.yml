name: Bug Report
description: Report a bug in Jekyll Link Card
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Add `{% link_card https://example.com %}` to a post
        2. Run `bundle exec jekyll build`
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Jekyll Link Card version
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: input
    id: ruby-version
    attributes:
      label: Ruby version
      placeholder: "e.g. 3.3.0"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other context about the problem.
