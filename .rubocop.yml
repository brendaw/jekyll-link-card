AllCops:
  TargetRubyVersion: 2.7
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Exclude:
    - "lib/**/*"
    - "spec/**/*"

Naming/FileName:
  Exclude:
    - "lib/jekyll-link-card.rb"

Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

Metrics/MethodLength:
  Max: 15

Metrics/CyclomaticComplexity:
  Max: 10
